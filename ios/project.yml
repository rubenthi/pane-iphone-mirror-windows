name: PaneFiles
options:
  bundleIdPrefix: io.github.rubenthi
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '2.6.1'
    CURRENT_PROJECT_VERSION: '7'
    CODE_SIGN_STYLE: Automatic
targets:
  PaneFiles:
    type: application
    platform: iOS
    sources: [PaneFiles]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rubenthi.PaneFiles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PaneFiles/Info.plist
    scheme:
      gatherCoverageData: false
      testTargets: [PaneFilesTests, PaneFilesUITests]
  PaneFilesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PaneFilesTests]
    dependencies:
      - target: PaneFiles
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rubenthi.PaneFiles.Tests
  PaneFilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PaneFilesUITests]
    dependencies:
      - target: PaneFiles
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rubenthi.PaneFiles.UITests
