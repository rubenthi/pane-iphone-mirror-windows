name: IndependentCompanion
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "7"
    PANE_BUNDLE_BASE: org.panenext.independent.companion
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_ENTITLEMENTS: Shared/Shared.entitlements
targets:
  IndependentCompanion:
    type: application
    platform: iOS
    sources:
      - App
      - path: Shared
        excludes: ["*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PANE_BUNDLE_BASE)"
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: ScreenBroadcast
        embed: true
  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - path: Shared
        excludes: ["*.entitlements", "FileRules.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PANE_BUNDLE_BASE).broadcast"
        INFOPLIST_FILE: Broadcast/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  IndependentCompanion:
    build:
      targets:
        IndependentCompanion: all

