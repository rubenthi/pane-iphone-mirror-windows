name: Build and publish Pane
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a version tag and refuse published versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ((Get-Content handset/version.py | Select-String '^VERSION = "([0-9.]+)"').Matches.Groups[1].Value)
          if (-not $version) { throw 'Missing release version' }
          $tag = "v$version"
          if ('${{ github.ref_name }}' -ne $tag -and '${{ github.ref_name }}' -ne "release/$version") { throw 'Use a matching version tag or release branch' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $releases = gh api repos/${{ github.repository }}/releases --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases.' }
          if ($releases | Where-Object tag_name -eq $tag) { throw 'Version already exists; choose a new version.' }
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/ui.test.cjs tests/hevc.test.cjs tests/stream.test.cjs
      - run: npm ci --ignore-scripts
      - run: npm run test:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ github.run_id }}
          path: test-results/
      - run: |
          node --check handset/web/app.js
          node --check handset/web/mirror.js
          node --check handset/web/keys.js
          node --check handset/web/shell.js
          node --check handset/web/hevc.js
          node --check handset/web/stream.js
          node --check handset/web/audio.js
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_update.tests.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1
      - run: python packaging/release_manifest.py --tag '${{ env.RELEASE_TAG }}'
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke.ps1
      - name: Verify executable metadata and manifest
        shell: pwsh
        run: |
          $m = Get-Content dist/update.json | ConvertFrom-Json
          if ((Get-Item dist/Pane.exe).VersionInfo.ProductVersion -ne $m.version) { throw 'Version mismatch' }
          if ((Get-FileHash dist/Pane.exe).Hash -ne $m.sha256) { throw 'Checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-${{ env.RELEASE_TAG }}
          path: |
            dist/Pane.exe
            dist/update.json
            dist/install.ps1
      - name: Publish all verified assets together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/heads/')) {
            $head = gh api 'repos/${{ github.repository }}/git/ref/heads/${{ github.ref_name }}' --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or $head -ne '${{ github.sha }}') { throw 'Source changed during verification; the newer build will publish.' }
          }
          gh release create '${{ env.RELEASE_TAG }}' dist/Pane.exe dist/update.json dist/install.ps1 --repo '${{ github.repository }}' --target '${{ github.sha }}' --draft --title 'Pane ${{ env.RELEASE_TAG }}' --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft retained.' }
          gh release edit '${{ env.RELEASE_TAG }}' --repo '${{ github.repository }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
