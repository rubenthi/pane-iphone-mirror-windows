name: Build and publish Pane
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['handset/version.py', 'packaging/version.txt', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pane-release-publication
  cancel-in-progress: false
jobs:
  companion:
    uses: ./.github/workflows/companion.yml
  release:
    needs: companion
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pane-unsigned
          path: ios
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine release version and refuse overwrites
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from handset.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) { throw 'Tag does not match source version.' }
          if ('${{ github.ref_type }}' -ne 'tag' -and '${{ github.ref_name }}' -ne 'main') { throw 'Publish only from main or a version tag.' }
          "PANE_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $releases = gh api repos/${{ github.repository }}/releases --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases.' }
          if ($releases | Where-Object tag_name -eq $tag) { throw 'Version already exists; choose a new version.' }
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/ui.test.cjs tests/hevc.test.cjs tests/stream.test.cjs
      - run: npm ci --ignore-scripts
      - run: npm run test:native
      - run: |
          node --check handset/web/app.js
          node --check handset/web/mirror.js
          node --check handset/web/keys.js
          node --check handset/web/shell.js
          node --check handset/web/hevc.js
          node --check handset/web/onboarding.js
          node --check handset/web/setup.js
          node --check handset/web/stream.js
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_update.tests.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1
      - run: python packaging/release_manifest.py --tag '${{ env.PANE_RELEASE_TAG }}'
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke.ps1
      - name: Verify executable metadata and manifest
        shell: pwsh
        run: |
          $m = Get-Content dist/update.json | ConvertFrom-Json
          if ((Get-Item dist/Pane.exe).VersionInfo.ProductVersion -ne $m.version) { throw 'Version mismatch' }
          if ((Get-FileHash dist/Pane.exe).Hash -ne $m.sha256) { throw 'Checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-${{ env.PANE_RELEASE_TAG }}
          path: |
            dist/Pane.exe
            dist/update.json
            dist/install.ps1
      - name: Publish all verified assets together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ env.PANE_RELEASE_TAG }}' dist/Pane.exe dist/update.json dist/install.ps1 --repo '${{ github.repository }}' --target '${{ github.sha }}' --draft --title 'Pane ${{ env.PANE_RELEASE_TAG }}' --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft retained.' }
          gh release edit '${{ env.PANE_RELEASE_TAG }}' --repo '${{ github.repository }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
