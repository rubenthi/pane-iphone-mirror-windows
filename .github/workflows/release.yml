name: Build and publish Pane
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Require a version tag and refuse published versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -ne 'tag') { throw 'Run this workflow on a version tag.' }
          $releases = gh api repos/${{ github.repository }}/releases --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases.' }
          if ($releases | Where-Object tag_name -eq '${{ github.ref_name }}') { throw 'Version already exists; choose a new version.' }
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/ui.test.cjs tests/hevc.test.cjs
      - run: npm ci --ignore-scripts
      - run: npm run test:native
      - run: |
          node --check handset/web/app.js
          node --check handset/web/mirror.js
          node --check handset/web/keys.js
          node --check handset/web/shell.js
          node --check handset/web/hevc.js
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_update.tests.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1
      - run: python packaging/release_manifest.py --tag '${{ github.ref_name }}'
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke.ps1
      - name: Verify executable metadata and manifest
        shell: pwsh
        run: |
          $m = Get-Content dist/update.json | ConvertFrom-Json
          if ((Get-Item dist/Pane.exe).VersionInfo.ProductVersion -ne $m.version) { throw 'Version mismatch' }
          if ((Get-FileHash dist/Pane.exe).Hash -ne $m.sha256) { throw 'Checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-${{ github.ref_name }}
          path: |
            dist/Pane.exe
            dist/update.json
            dist/install.ps1
      - name: Publish all verified assets together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' dist/Pane.exe dist/update.json dist/install.ps1 --repo '${{ github.repository }}' --verify-tag --draft --title 'Pane ${{ github.ref_name }}' --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft retained.' }
          gh release edit '${{ github.ref_name }}' --repo '${{ github.repository }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
