name: Build and publish Pane
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'handset/**'
      - 'native/**'
      - 'signer/**'
      - 'ios/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/companion.yml'
      - '!**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pane-release-publication
  cancel-in-progress: false
jobs:
  companion:
    uses: ./.github/workflows/companion.yml
  release:
    needs: companion
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Pane-unsigned
          path: ios
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare immutable release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:SOURCE_REF_TYPE -ne 'tag' -and $env:SOURCE_REF_NAME -ne 'main') { throw 'Publish only from main or a version tag.' }
          gh api 'repos/${{ github.repository }}/releases?per_page=100' --paginate --slurp > "$env:RUNNER_TEMP/releases.json"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases.' }
          $arguments = @('packaging/prepare_release.py', '--releases', "$env:RUNNER_TEMP/releases.json", '--source', $env:SOURCE_SHA, '--output', $env:GITHUB_ENV)
          if ($env:SOURCE_REF_TYPE -eq 'tag') { $arguments += @('--tag', $env:SOURCE_REF_NAME) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/ui.test.cjs tests/hevc.test.cjs tests/stream.test.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:setup
      - run: npm run test:experience
      - run: npm run test:companion-update
      - run: npm run test:visual
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: npm run test:native
      - run: |
          node --check handset/web/app.js
          node --check handset/web/mirror.js
          node --check handset/web/keys.js
          node --check handset/web/shell.js
          node --check handset/web/hevc.js
          node --check handset/web/onboarding.js
          node --check handset/web/setup.js
          node --check handset/web/experience.js
          node --check handset/web/selects.js
          node --check handset/web/companion-update.js
          node --check handset/web/stream.js
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_update.tests.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1
      - run: python packaging/release_manifest.py --tag '${{ env.PANE_RELEASE_TAG }}'
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke.ps1
      - name: Verify executable metadata and manifest
        shell: pwsh
        run: |
          $m = Get-Content dist/update.json | ConvertFrom-Json
          if ((Get-Item dist/Pane.exe).VersionInfo.ProductVersion -ne $m.version) { throw 'Version mismatch' }
          if ((Get-FileHash dist/Pane.exe).Hash -ne $m.sha256) { throw 'Checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-${{ env.PANE_RELEASE_TAG }}
          path: |
            dist/Pane.exe
            dist/update.json
            dist/install.ps1
            ios/Pane-unsigned.ipa
      - name: Publish all verified assets together
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          # Supersede only for newer release inputs, not docs/tests-only pushes.
          if ($env:SOURCE_REF_TYPE -ne 'tag') {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect current main.' }
            $main = git rev-parse FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve current main.' }
            python packaging/prepare_release.py --source $env:SOURCE_SHA --check-current $main
            if ($LASTEXITCODE -ne 0) { throw 'Source superseded or main history changed.' }
            git tag $env:PANE_RELEASE_TAG $env:PANE_RELEASE_COMMIT
            if ($LASTEXITCODE -ne 0) { throw 'Tag collision; no publication.' }
            git push origin "refs/tags/$env:PANE_RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Tag reservation failed; no publication.' }
          }
          # Tags from GITHUB_TOKEN do not start another workflow. Never force-push.
          $notes = "Automated tested release from source $env:SOURCE_SHA (release commit $env:PANE_RELEASE_COMMIT).`n`nWindows updates install after normal exit; reopen Pane afterward. Settings and pairings are preserved. iPhone companion installation/signing remains separate. Physical-device behavior is not hardware-verified by CI."
          gh release create $env:PANE_RELEASE_TAG dist/Pane.exe dist/update.json dist/install.ps1 ios/Pane-unsigned.ipa --repo '${{ github.repository }}' --verify-tag --draft --title "Pane $env:PANE_RELEASE_TAG" --generate-notes --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; inspect tag/draft before recovery.' }
          gh release edit $env:PANE_RELEASE_TAG --repo '${{ github.repository }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; draft retained.' }
