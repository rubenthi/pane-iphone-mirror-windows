name: Validate and build desktop reset
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:native
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_update.tests.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-Windows
          path: dist/Pane.exe
