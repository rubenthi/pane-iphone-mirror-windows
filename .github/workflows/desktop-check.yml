name: Validate and build Pane
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  companion:
    uses: ./.github/workflows/companion.yml
  windows:
    needs: companion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pane-unsigned
          path: ios
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:setup
      - run: npm run test:experience
      - run: npm run test:visual
      - run: npm run test:native
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_update.tests.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-Windows
          path: dist/Pane.exe
