name: Pane security checks

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the TLS test dependency
        run: python3 -m pip install cryptography==50.0.2
      - name: Run Python security tests
        run: python3 -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check handset/web/app.js
          node --check handset/web/mirror.js
          node --check handset/web/setup.js
          node --check handset/web/icons.js
          node --check handset/web/experience.js
          node --check handset/web/selects.js
          node --check handset/web/companion-update.js
          node --check handset/web/onboarding.js
          node --check handset/web/shell.js
          node --test tests/ui.test.cjs
      - name: Install browser test tools
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise setup and Uploads UI
        run: npm run test:setup
      - name: Exercise compact menus and preferences
        run: npm run test:experience
      - name: Exercise mobile-update startup popup
        run: npm run test:companion-update
      - name: Exercise custom controls, visual states and zoom
        run: npm run test:visual
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --target x86_64-pc-windows-gnu -- -D warnings
