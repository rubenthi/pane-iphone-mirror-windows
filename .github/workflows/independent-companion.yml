name: Independent iPhone companion
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'independent/companion/**'
      - '.github/workflows/independent-companion.yml'
permissions:
  contents: read
jobs:
  companion:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate project, run protocol tests and build both iOS targets
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version
          xcodebuild -version
          bash independent/companion/build.sh
          bash independent/companion/Tests/simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-companion-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            independent/companion/build/IndependentCompanion-unsigned.ipa
            independent/companion/build/SHA256SUMS
            independent/companion/build/simulator-launch.png
            independent/companion/build/colors.pnvm
          if-no-files-found: error

