[package]
name = "pane-signer"
version = "2.1.0"
edition = "2024"
[dependencies]
isideload = { git = "https://github.com/nab138/isideload", rev = "326e56229d0727cb6e7b34c8cf03e37e2cd3e17d", default-features = false, features = ["install", "tokio-mt"] }
idevice = { version = "=0.1.61", default-features = false, features = ["usbmuxd", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
rootcause = "0.12"
